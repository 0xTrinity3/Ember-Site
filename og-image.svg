    </radialGradient>
    <radialGradient id="ember-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b87a" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#d4874d" stop-opacity="0.1"/>
